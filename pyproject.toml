[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "habibi"
dynamic = ["version"]
description = "Modular read-only Git repository public-release security auditor"
requires-python = ">=3.9"
dependencies = ["tomli>=2.0; python_version < '3.11'"]
license = {text = "MIT"}

[project.scripts]
habibi = "habibi.cli:main"

[tool.setuptools.packages.find]
include = ["habibi*"]

[tool.setuptools.package-data]
"habibi.plugins" = ["plugin_security_rules.txt"]

[tool.setuptools.dynamic]
version = {attr = "habibi._version.__version__"}
